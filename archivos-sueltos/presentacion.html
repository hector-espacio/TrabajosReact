<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Presentación</title>
    <style>
        /* Estilos generales limpios y sin sombras */
        body {
            margin: 0;
            padding: 40px;
            background-color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            color: #000000;
        }

        /* Contenedor principal en formato de bloque normal, no tarjeta */
        .container {
            max-width: 300px;
            margin: 0 auto;
            border: 2px solid darkblue;
            padding: 40px;
border-radius:10px;
        }

        /* Foto de perfil grande y cuadrada */
        img {
         
            height: 250px;
           border-radius:10px;
            margin-bottom: 20px;
        }

        /* Título gigante y claro */
        h1 {
            font-size: 36px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        /* Profesión grande */
        h2 {
            font-size: 20px;
            margin: 0 0 20px 0;
            font-weight: bold;
           
        }

        /* Párrafo con letra grande y legible */
        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Enlaces como botones planos estilo retro */
        .links {
            display: flex;
justify-content:center;
            margin-top: 15px;
        }

        .links a {
            display: inline-block;
            background-color:  #333333;
            color: #ffffff;
border-radius:10px;
            text-decoration: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .links a:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="maxipro2.jpeg" alt="Foto de perfil">
        
        <h1>Hector</h1>
        <h2>Frontend Developer</h2>
        
        <p>Hola. Estoy aprendiendo desarrollo web y esta es mi página personal. Aquí muestro quién soy y cuáles son mis enlaces de contacto de forma directa y sencilla.</p>
        
        <div class="links">
            <a href="https://github.com" target="_blank">web</a>
            <a href="https://linkedin.com" target="_blank">Whatsapp</a>
            <a href="mailto:tu-correo@example.com">Email</a>
        </div>
    </div>

</body>
</html>
